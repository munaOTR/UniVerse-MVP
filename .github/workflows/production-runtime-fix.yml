name: Production runtime fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch dashboard boot and auth
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('dashboard.html')
          s = p.read_text(encoding='utf-8')

          old = "window._supabase = supabase.createClient(supabaseUrl, supabaseKey);"
          new = """window._supabase = supabase.createClient(supabaseUrl, supabaseKey, {
            auth: {
                persistSession: true,
                autoRefreshToken: true,
                detectSessionInUrl: true,
                // iOS Safari can leave the default navigator lock waiting indefinitely.
                // Auth calls must remain recoverable so the dashboard can boot.
                lock: async (_name, _acquireTimeout, fn) => fn()
            }
        });"""
          if old not in s:
              raise SystemExit('Supabase client creation marker not found')
          s = s.replace(old, new, 1)

          old = """            currentSessionUser = session.user;
            currentUserId = session.user.id;"""
          new = """            currentSessionUser = session.user;
            currentUserId = session.user.id;
            // Make authenticated state available to the enhancement layer as well.
            window.currentSessionUser = currentSessionUser;
            window.currentUserId = currentUserId;"""
          if old not in s:
              raise SystemExit('session state marker not found')
          s = s.replace(old, new, 1)

          old = """            userUniversity = (profile?.university || metadataUniversity || '').trim();
            userFullName = (profile?.full_name || metadataFullName || '').trim();"""
          new = """            userUniversity = (profile?.university || metadataUniversity || '').trim();
            userFullName = (profile?.full_name || metadataFullName || '').trim();
            window.userUniversity = userUniversity;
            window.userFullName = userFullName;"""
          if old not in s:
              raise SystemExit('profile state marker not found')
          s = s.replace(old, new, 1)

          old = """            setupOrbitRealtime();

            loadFeed(true);
            loadLodgeFeed(true);
            loadErrands(true);
        }"""
          new = """            setupOrbitRealtime();

            loadFeed(true);
            loadLodgeFeed(true);
            loadErrands(true);

            // Secondary modules were previously initialized before auth state existed.
            // Start them again after the authenticated campus is known.
            if (typeof initCampusChat === 'function') initCampusChat();
            if (typeof studyReload === 'function' && !studyState.loaded) studyReload();
            if (typeof renderTribes === 'function') renderTribes();
        }"""
          if old not in s:
              raise SystemExit('post-auth startup marker not found')
          s = s.replace(old, new, 1)

          old = """        if (document.readyState === 'complete') init(); else window.addEventListener('load', init, { once: true });"""
          new = """        // Do not wait for every external resource (especially enhancement/CDN scripts)
        // before starting authentication. Safari can otherwise leave the app on Verifying.
        if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init, { once: true });
        else init();"""
          if old not in s:
              raise SystemExit('startup marker not found')
          s = s.replace(old, new, 1)

          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dashboard.html
          git diff --cached --quiet && exit 0
          git commit -m 'fix: make production dashboard boot independently of external scripts'
          git push
