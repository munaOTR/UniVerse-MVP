name: Inject mobile app presentation CSS and notification config
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  inject:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inject dashboard-only presentation and public push key
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('dashboard.html')
          s=p.read_text(encoding='utf-8')
          link='<link id="universe-mobile-app-css" rel="stylesheet" href="/mobile-app.css">'
          if 'id="universe-mobile-app-css"' not in s:
              s=s.replace('</head>', link+'\n</head>', 1)
          public_key='BIgx8xy_gacjbLZ8uz-4pktk-fhJWUQQFcDD9MtddNhM9ur2_31OIa3NeZUXeD3payMiLtKGAeOyb8ejZhVsiT4'
          s=s.replace("const UNIVERSEICOS_PUSH_VAPID_PUBLIC_KEY = 'REPLACE_WITH_YOUR_VAPID_PUBLIC_KEY';", f"const UNIVERSEICOS_PUSH_VAPID_PUBLIC_KEY = '{public_key}';")
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit dashboard-only presentation and notification configuration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dashboard.html
          git diff --cached --quiet && exit 0
          git commit -m 'feat: configure dashboard web push public key'
          git push
