name: Fix dashboard Supabase auth lock

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch-dashboard:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pin Supabase Auth JS to iOS-safe version
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('dashboard.html')
          s = p.read_text(encoding='utf-8')
          old = 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2'
          new = 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.61.0'
          if old not in s:
              raise SystemExit('Expected Supabase CDN reference was not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit and push
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dashboard.html
          git diff --cached --quiet && exit 0
          git commit -m 'fix: prevent Supabase auth lock hang on dashboard'
          git push
